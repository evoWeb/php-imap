config_version = "0"

exclude_patterns = [
    "**/.ddev/**",
    "**/.github/**",
]

test_patterns = [
    "**/tests/**",
]

[smells]
mode = "comment"

[smells.function_parameters]
threshold = 7

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "php-codesniffer"

[[plugin]]
name = "phpstan"

[[plugin]]
name = "radarlint-php"
mode = "comment"

[[plugin]]
name = "ripgrep"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
