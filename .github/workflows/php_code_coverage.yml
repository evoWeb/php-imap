name: PHP Code Coverage

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [ review_requested ]

permissions:
  contents: read

jobs:
  coverage:
    name: PHPUnit Coverage Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]

    services:
      imap:
        image: dovecot/dovecot:latest
        env:
          USER_PASSWORD: testpass
        ports:
          - 31993:31993
        options: >-
          --health-cmd "nc -z localhost 31993"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, imap
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run test suite
        run: composer run phpunit-coverage
        env:
          PHPIMAP_IMAP_PATH: "{localhost:31993/imap/ssl/novalidate-cert}INBOX"
          PHPIMAP_LOGIN: testuser
          PHPIMAP_PASSWORD: testpass

      - uses: qltysh/qlty-action/coverage@a19242102d17e497f437d7466aa01b528537e899 # v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: .cache/clover.xml
